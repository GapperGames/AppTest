<title>Chords — Song View Prototype</title>

<style>
  :root {
    --ground:   #17140F;
    --surface:  #211D16;
    --raised:   #2C271D;
    --line:     #3A3327;
    --text:     #EDE6D8;
    --muted:    #9A9081;
    --faint:    #6B6455;
    --chord:    #E8A33D;
    --running:  #6FA88C;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --chart-size: 15px;
    --bar-h: 132px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ground:  #F7F3EA;
      --surface: #FFFDF8;
      --raised:  #EFE9DC;
      --line:    #DDD4C2;
      --text:    #1E1A14;
      --muted:   #6E6656;
      --faint:   #948B78;
      --chord:   #9C5F0E;
      --running: #2F6B51;
    }
  }
  :root[data-theme="light"] {
    --ground:  #F7F3EA;
    --surface: #FFFDF8;
    --raised:  #EFE9DC;
    --line:    #DDD4C2;
    --text:    #1E1A14;
    --muted:   #6E6656;
    --faint:   #948B78;
    --chord:   #9C5F0E;
    --running: #2F6B51;
  }
  :root[data-theme="dark"] {
    --ground:  #17140F;
    --surface: #211D16;
    --raised:  #2C271D;
    --line:    #3A3327;
    --text:    #EDE6D8;
    --muted:   #9A9081;
    --faint:   #6B6455;
    --chord:   #E8A33D;
    --running: #6FA88C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    position: relative;
    overflow: hidden;
  }

  /* ---------- header ---------- */

  .top {
    flex: none;
    padding: 18px 18px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    transition: padding .22s ease;
  }
  .top.compact { padding: 9px 18px 8px; }

  .crumb {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    transition: opacity .18s ease, height .22s ease, margin .22s ease;
    height: 20px;
    overflow: hidden;
  }
  .top.compact .crumb { opacity: 0; height: 0; margin-bottom: 0; }

  .back {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 0;
    cursor: pointer;
  }
  .back:hover { color: var(--text); }

  h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.022em;
    line-height: 1.03;
    text-transform: uppercase;
    text-wrap: balance;
    transition: font-size .22s ease;
  }
  .top.compact h1 { font-size: 17px; }

  .artist {
    margin: 5px 0 0;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--chord);
    letter-spacing: -0.01em;
  }
  .top.compact .artist { font-size: 11px; margin-top: 2px; }

  /* ---------- info chips ---------- */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 13px;
    transition: opacity .18s ease, height .22s ease, margin .22s ease;
  }
  .top.compact .chips { opacity: 0; height: 0; margin-top: 0; overflow: hidden; }

  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--ground);
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .chip .k {
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .chip .v { color: var(--text); }
  .chip.absent .v { color: var(--faint); font-style: italic; }
  .chip.shifted { border-color: var(--chord); }
  .chip.shifted .v { color: var(--chord); }

  /* ---------- chart ---------- */

  .chart {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: auto;
    padding: 20px 18px calc(var(--bar-h) + 32px);
    font-family: var(--mono);
    font-size: var(--chart-size);
    line-height: 1.52;
    scrollbar-width: thin;
  }

  .sect {
    margin: 26px 0 9px;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sect::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .sect:first-child { margin-top: 0; }

  .cline {
    position: relative;
    height: calc(var(--chart-size) * 1.52);
    white-space: pre;
  }
  .lline { white-space: pre; }
  .blank { height: calc(var(--chart-size) * 0.8); }

  .ch {
    position: absolute;
    top: 0;
    color: var(--chord);
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-weight: 700;
    line-height: inherit;
    white-space: pre;
  }
  .ch:hover, .ch:focus-visible {
    outline: none;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- control bar ---------- */

  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 11px 14px calc(11px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .lab {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--faint);
    width: 42px;
    flex: none;
  }

  button.b {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text);
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    height: 40px;
    min-width: 40px;
    padding: 0 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .12s ease, border-color .12s ease;
  }
  button.b:hover { border-color: var(--faint); }
  button.b:active { background: var(--line); }
  button.b:focus-visible { outline: 2px solid var(--chord); outline-offset: 2px; }
  button.b[disabled] { opacity: .35; cursor: default; }

  button.b.on {
    background: var(--running);
    border-color: var(--running);
    color: var(--ground);
  }
  button.b.amber {
    background: var(--chord);
    border-color: var(--chord);
    color: var(--ground);
    font-weight: 700;
  }

  .steps {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--raised);
  }
  .steps button {
    border: none;
    background: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 17px;
    width: 40px;
    height: 40px;
    cursor: pointer;
  }
  .steps button:hover { background: var(--line); }
  .steps button:focus-visible { outline: 2px solid var(--chord); outline-offset: -2px; }

  .stepval {
    min-width: 62px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stepval .big { font-size: 14px; font-weight: 700; color: var(--chord); }
  .stepval .sub { font-size: 9px; color: var(--faint); }

  input[type=range] {
    flex: 1;
    accent-color: var(--chord);
    height: 40px;
    cursor: pointer;
    min-width: 0;
  }

  .spd {
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    width: 56px;
    text-align: right;
    flex: none;
  }

  /* ---------- chord sheet ---------- */

  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(101%);
    transition: transform .26s cubic-bezier(.32,.72,0,1);
  }
  .sheet.open { transform: translateY(0); }

  .grab {
    width: 34px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 14px;
  }

  .sheet h2 {
    margin: 0 0 2px;
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 700;
    color: var(--chord);
  }
  .sheet .note {
    margin: 0 0 14px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
  }
  .shapes { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="phone">

  <header class="top" id="top">
    <div class="crumb">
      <button class="back" type="button">&larr; results</button>
      <span class="back" style="color:var(--faint)">version 3 &middot; 4.9&#9733; &middot; 812 votes</span>
    </div>
    <h1 id="title">Paper Lanterns</h1>
    <p class="artist" id="artistName">the hollow coast</p>
    <div class="chips" id="chips"></div>
  </header>

  <main class="chart" id="chart" tabindex="0"></main>

  <div class="bar">
    <div class="row">
      <span class="lab">Key</span>
      <div class="steps">
        <button type="button" id="down" aria-label="Transpose down one semitone">&minus;</button>
        <div class="stepval">
          <span class="big" id="keyNow">G</span>
          <span class="sub" id="keyOff">original</span>
        </div>
        <button type="button" id="up" aria-label="Transpose up one semitone">+</button>
      </div>
      <button class="b" type="button" id="capo" title="Show the chords that actually sound, with the capo folded in">Capo 3</button>
      <button class="b" type="button" id="reset" disabled>Reset</button>
    </div>

    <div class="row">
      <span class="lab">Scroll</span>
      <button class="b" type="button" id="play" aria-label="Start auto-scroll">&#9654;</button>
      <input type="range" id="speed" min="4" max="90" value="26" aria-label="Scroll speed">
      <span class="spd" id="spdOut">26 px/s</span>
      <button class="b" type="button" id="fit" title="Pace the scroll so the chart ends when the track does">Fit</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="grab"></div>
    <h2 id="sheetName">G</h2>
    <p class="note" id="sheetNote"></p>
    <div class="shapes" id="shapes"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Song source — stored in Ultimate Guitar's own [ch] markup so
     this prototype exercises the real parse path from the tech pass.
     Lyrics here are placeholder copy written for the mockup.
     ============================================================ */

  var RAW = [
    "[Intro]",
    "[ch]G[/ch]      [ch]D/F#[/ch]    [ch]Em7[/ch]     [ch]Cadd9[/ch]",
    "",
    "[Verse 1]",
    "[ch]G[/ch]               [ch]D/F#[/ch]",
    "We drove the long road out of town,",
    "[ch]Em7[/ch]             [ch]Cadd9[/ch]",
    "paper lanterns in the back.",
    "[ch]G[/ch]               [ch]D/F#[/ch]",
    "You said the summer wouldn't end,",
    "[ch]Em7[/ch]         [ch]Cadd9[/ch]",
    "I took you at your word.",
    "",
    "[Chorus]",
    "[ch]Am[/ch]          [ch]C[/ch]",
    "So hold the light a little longer,",
    "[ch]G[/ch]           [ch]D[/ch]",
    "let the evening take its time.",
    "[ch]Am[/ch]          [ch]C[/ch]",
    "Every window in the valley",
    "[ch]G[/ch]           [ch]D[/ch]       [ch]Cadd9[/ch]",
    "burning like it's ours tonight.",
    "",
    "[Verse 2]",
    "[ch]G[/ch]               [ch]D/F#[/ch]",
    "The radio was losing signal,",
    "[ch]Em7[/ch]             [ch]Cadd9[/ch]",
    "static where the chorus was.",
    "[ch]G[/ch]               [ch]D/F#[/ch]",
    "We sang the parts we still remembered",
    "[ch]Em7[/ch]         [ch]Cadd9[/ch]",
    "and made up all the rest.",
    "",
    "[Bridge]",
    "[ch]Em7[/ch]        [ch]Cadd9[/ch]     [ch]G[/ch]        [ch]D[/ch]",
    "And if the morning comes to find us,",
    "[ch]Em7[/ch]        [ch]Cadd9[/ch]     [ch]G[/ch]        [ch]D[/ch]",
    "we will be a mile from here.",
    "",
    "[Outro]",
    "[ch]G[/ch]      [ch]D/F#[/ch]    [ch]Em7[/ch]     [ch]Cadd9[/ch]  [ch]G[/ch]"
  ].join("\n");

  // Metadata as the normalized Song type resolves it. bpm/durationMs come from
  // the external lookup; either can be null, and the UI must survive that.
  var SONG = {
    writtenKey: "G",
    capo: 3,
    tuning: "E A D G B E",
    difficulty: "Intermediate",
    bpm: 84,
    durationMs: 231000
  };

  /* ---------- music theory ---------- */

  var SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  var IDX = { "C":0,"C#":1,"Db":1,"D":2,"D#":3,"Eb":3,"E":4,"Fb":4,"E#":5,
              "F":5,"F#":6,"Gb":6,"G":7,"G#":8,"Ab":8,"A":9,"A#":10,"Bb":10,
              "B":11,"Cb":11 };
  // Keys conventionally spelled with flats.
  var FLATKEYS = { 1:1, 3:1, 5:1, 8:1, 10:1 };

  function shiftNote(note, semis, useFlat) {
    var i = IDX[note];
    if (i === undefined) return note;
    var t = ((i + semis) % 12 + 12) % 12;
    return useFlat ? FLAT[t] : SHARP[t];
  }

  // Handles quality suffixes and slash bass: Cadd9, D/F#, F#m7...
  function shiftChord(chord, semis, useFlat) {
    if (!semis) return chord;
    return chord.split("/").map(function (part) {
      var m = /^([A-G][#b]?)(.*)$/.exec(part);
      return m ? shiftNote(m[1], semis, useFlat) + m[2] : part;
    }).join("/");
  }

  /* ---------- parse UG [ch] markup ---------- */

  function parse(raw) {
    return raw.split("\n").map(function (line) {
      var sec = /^\[([A-Za-z][^\]]*)\]\s*$/.exec(line);
      if (sec && line.indexOf("[ch]") === -1) return { t: "sect", text: sec[1] };
      if (!line.trim()) return { t: "blank" };

      if (line.indexOf("[ch]") !== -1) {
        var out = [], col = 0, i = 0;
        while (i < line.length) {
          if (line.substr(i, 4) === "[ch]") {
            var end = line.indexOf("[/ch]", i);
            if (end === -1) { col++; i++; continue; }
            var c = line.slice(i + 4, end);
            out.push({ col: col, chord: c });
            col += c.length;
            i = end + 5;
          } else { col++; i++; }
        }
        return { t: "chords", items: out };
      }
      return { t: "lyric", text: line };
    });
  }

  var LINES = parse(RAW);

  /* ---------- state ---------- */

  var st = {
    semis: 0,        // user transpose offset
    concert: false,  // fold the capo in and show what actually sounds
    scrolling: false,
    speed: 26,
    fit: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var chart = $("chart"), top = $("top");

  // Total offset applied to every chord on screen.
  function offset() { return st.semis + (st.concert ? SONG.capo : 0); }

  function currentKey() {
    var o = offset();
    return shiftNote(SONG.writtenKey, o, !!FLATKEYS[((IDX[SONG.writtenKey] + o) % 12 + 12) % 12]);
  }

  /* ---------- render chart ----------
     Chords are absolutely positioned at their source column in `ch` units so
     that transposing (G -> G#, one char wider) never shears the alignment.
     A left-to-right pass pushes any chord that would collide with its
     neighbour — the thing UG's own renderer gets wrong.
  */

  function render() {
    var o = offset();
    var useFlat = !!FLATKEYS[((IDX[SONG.writtenKey] + o) % 12 + 12) % 12];
    var frag = document.createDocumentFragment();

    LINES.forEach(function (ln) {
      var el;
      if (ln.t === "sect") {
        el = document.createElement("div");
        el.className = "sect";
        el.textContent = ln.text;
      } else if (ln.t === "blank") {
        el = document.createElement("div");
        el.className = "blank";
      } else if (ln.t === "lyric") {
        el = document.createElement("div");
        el.className = "lline";
        el.textContent = ln.text;
      } else {
        el = document.createElement("div");
        el.className = "cline";
        var cursor = -1;
        ln.items.forEach(function (it) {
          var name = shiftChord(it.chord, o, useFlat);
          var col = it.col;
          if (col <= cursor) col = cursor + 1;   // collision nudge
          cursor = col + name.length;
          var b = document.createElement("button");
          b.type = "button";
          b.className = "ch";
          b.style.left = col + "ch";
          b.textContent = name;
          b.addEventListener("click", function () { openSheet(name, it.chord); });
          el.appendChild(b);
        });
      }
      frag.appendChild(el);
    });

    chart.replaceChildren(frag);
  }

  /* ---------- chips ---------- */

  function fmtDur(ms) {
    if (ms == null) return null;
    var s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function chip(k, v, cls) {
    var d = document.createElement("div");
    d.className = "chip" + (cls ? " " + cls : "");
    var a = document.createElement("span"); a.className = "k"; a.textContent = k;
    var b = document.createElement("span"); b.className = "v";
    b.textContent = v == null ? "unknown" : v;
    if (v == null) d.classList.add("absent");
    d.appendChild(a); d.appendChild(b);
    return d;
  }

  function renderChips() {
    var box = $("chips");
    box.replaceChildren();
    var o = offset();

    // The key chip carries the whole story: written key, capo, where you are now.
    var label = currentKey();
    if (o !== 0) label = SONG.writtenKey + " → " + currentKey();
    box.appendChild(chip("Key", label, o !== 0 ? "shifted" : ""));

    box.appendChild(chip("Capo", st.concert ? "folded in" : "fret " + SONG.capo,
                         st.concert ? "shifted" : ""));
    box.appendChild(chip("BPM", SONG.bpm));
    box.appendChild(chip("Length", fmtDur(SONG.durationMs)));
    box.appendChild(chip("Tuning", SONG.tuning));

    $("keyNow").textContent = currentKey();
    $("keyOff").textContent =
      st.semis === 0 ? (st.concert ? "sounding" : "original")
                     : (st.semis > 0 ? "+" : "") + st.semis + " semi";
    $("reset").disabled = (st.semis === 0 && !st.concert);
    $("capo").classList.toggle("amber", st.concert);
  }

  /* ---------- chord diagrams ----------
     Real app reads UG's `applicature` for written chords. Transposed chords
     have no stored shape, so we fall back to movable barre forms — which is
     how a player would actually find them.
  */

  var OPEN = {
    "G":     [3,2,0,0,0,3], "C": [-1,3,2,0,1,0], "D": [-1,-1,0,2,3,2],
    "Em7":   [0,2,0,0,0,0], "Am": [-1,0,2,2,1,0], "E": [0,2,2,1,0,0],
    "Cadd9": [-1,3,2,0,3,3], "D/F#": [2,0,0,2,3,2], "A": [-1,0,2,2,2,0],
    "Am7":   [-1,0,2,0,1,0], "Dm": [-1,-1,0,2,3,1], "F": [1,3,3,2,1,1]
  };

  // E-shape barre rooted on string 6 (root at fret = semitones above E).
  var ESHAPE = { "":[0,2,2,1,0,0], "m":[0,2,2,0,0,0], "7":[0,2,0,1,0,0], "m7":[0,2,0,0,0,0] };

  function deriveShape(name) {
    var m = /^([A-G][#b]?)(m7|m|7|)/.exec(name);
    if (!m) return null;
    var root = IDX[m[1]];
    if (root === undefined) return null;
    var fret = ((root - 4) % 12 + 12) % 12;   // 4 = E
    if (fret === 0) fret = 12;
    var base = ESHAPE[m[2]] || ESHAPE[""];
    return { frets: base.map(function (f) { return f + fret; }), barre: fret, derived: true };
  }

  function diagram(frets, barre) {
    var W = 92, H = 116, L = 20, T = 26, SW = (W - L - 12) / 5, FH = (H - T - 12) / 4;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    function ln(x1, y1, x2, y2, w, c) {
      var e = document.createElementNS(ns, "line");
      e.setAttribute("x1", x1); e.setAttribute("y1", y1);
      e.setAttribute("x2", x2); e.setAttribute("y2", y2);
      e.setAttribute("stroke", c || "currentColor");
      e.setAttribute("stroke-width", w || 1);
      svg.appendChild(e);
    }

    var openPos = !barre;
    // nut or position marker
    ln(L, T, L + SW * 5, T, openPos ? 3.5 : 1);
    for (var f = 1; f <= 4; f++) ln(L, T + FH * f, L + SW * 5, T + FH * f, 1);
    for (var s = 0; s < 6; s++) ln(L + SW * s, T, L + SW * s, T + FH * 4, 1);

    if (barre) {
      var t = document.createElementNS(ns, "text");
      t.setAttribute("x", L - 6); t.setAttribute("y", T + FH * 0.72);
      t.setAttribute("text-anchor", "end");
      t.setAttribute("font-size", "10"); t.setAttribute("font-family", "monospace");
      t.setAttribute("fill", "currentColor"); t.setAttribute("opacity", ".65");
      t.textContent = barre;
      svg.appendChild(t);
    }

    frets.forEach(function (fr, i) {
      var x = L + SW * i;
      var rel = barre ? fr - barre + 1 : fr;
      if (fr === -1 || rel === 0) {
        var t2 = document.createElementNS(ns, "text");
        t2.setAttribute("x", x); t2.setAttribute("y", T - 7);
        t2.setAttribute("text-anchor", "middle");
        t2.setAttribute("font-size", "11"); t2.setAttribute("font-family", "monospace");
        t2.setAttribute("fill", "currentColor");
        t2.setAttribute("opacity", fr === -1 ? ".38" : ".75");
        t2.textContent = fr === -1 ? "×" : "○";
        svg.appendChild(t2);
        return;
      }
      if (rel < 1 || rel > 4) return;
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", x);
      c.setAttribute("cy", T + FH * (rel - 0.5));
      c.setAttribute("r", 6.5);
      c.setAttribute("fill", "currentColor");
      svg.appendChild(c);
    });

    return svg;
  }

  function openSheet(name, original) {
    $("sheetName").textContent = name;
    var box = $("shapes");
    box.replaceChildren();

    var shape = OPEN[name] ? { frets: OPEN[name], barre: 0 } : deriveShape(name);
    if (shape) {
      var d = diagram(shape.frets, shape.barre);
      d.style.color = "var(--text)";
      box.appendChild(d);
    }

    var parts = [];
    if (name !== original) parts.push("transposed from " + original);
    if (st.concert) parts.push("sounding pitch, capo " + SONG.capo + " folded in");
    else if (SONG.capo) parts.push("shape as played with capo " + SONG.capo);
    if (shape && shape.derived) parts.push("barre form — no stored fingering");
    $("sheetNote").textContent = parts.join(" · ") || "open position";

    $("sheet").classList.add("open");
    $("scrim").classList.add("open");
  }

  function closeSheet() {
    $("sheet").classList.remove("open");
    $("scrim").classList.remove("open");
  }

  /* ---------- auto-scroll ----------
     Fractional pixels accumulate and only whole pixels are applied, so slow
     speeds glide instead of stepping the way an interval-based scroll does.
  */

  var acc = 0, last = 0, raf = 0, wake = null;

  function frame(ts) {
    if (!st.scrolling) return;
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    acc += st.speed * dt;
    var whole = Math.floor(acc);
    if (whole >= 1) {
      acc -= whole;
      chart.scrollTop += whole;
      if (chart.scrollTop + chart.clientHeight >= chart.scrollHeight - 1) {
        stop();
        return;
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    st.scrolling = true;
    last = 0; acc = 0;
    $("play").innerHTML = "&#10073;&#10073;";
    $("play").classList.add("on");
    $("play").setAttribute("aria-label", "Pause auto-scroll");
    raf = requestAnimationFrame(frame);
    // Keeping the screen awake is the whole reason this is usable mid-song.
    if (navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(function (w) { wake = w; })
        .catch(function () { /* denied in this frame — harmless */ });
    }
  }

  function stop() {
    st.scrolling = false;
    cancelAnimationFrame(raf);
    $("play").innerHTML = "&#9654;";
    $("play").classList.remove("on");
    $("play").setAttribute("aria-label", "Start auto-scroll");
    if (wake) { wake.release().catch(function () {}); wake = null; }
  }

  function setSpeed(v, fromFit) {
    st.speed = v;
    $("speed").value = Math.min(90, Math.max(4, Math.round(v)));
    $("spdOut").textContent = v.toFixed(v < 10 ? 1 : 0) + " px/s";
    if (!fromFit) {
      st.fit = false;
      $("fit").classList.remove("amber");
    }
  }

  // Fit-to-song: distance left to travel divided by track length. This is the
  // feature the duration lookup pays for, and it needs durationMs to exist.
  function applyFit() {
    if (SONG.durationMs == null) return;
    var dist = chart.scrollHeight - chart.clientHeight;
    if (dist <= 0) return;
    st.fit = true;
    $("fit").classList.add("amber");
    setSpeed(dist / (SONG.durationMs / 1000), true);
  }

  /* ---------- wiring ---------- */

  $("up").addEventListener("click", function () {
    if (st.semis < 11) { st.semis++; render(); renderChips(); }
  });
  $("down").addEventListener("click", function () {
    if (st.semis > -11) { st.semis--; render(); renderChips(); }
  });
  $("reset").addEventListener("click", function () {
    st.semis = 0; st.concert = false; render(); renderChips();
  });
  $("capo").addEventListener("click", function () {
    st.concert = !st.concert; render(); renderChips();
  });

  $("play").addEventListener("click", function () { st.scrolling ? stop() : start(); });
  $("speed").addEventListener("input", function (e) { setSpeed(Number(e.target.value)); });
  $("fit").addEventListener("click", function () {
    if (st.fit) { st.fit = false; $("fit").classList.remove("amber"); setSpeed(26); }
    else applyFit();
  });

  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
  });

  // Collapse the header once you're into the song — the title has done its job.
  chart.addEventListener("scroll", function () {
    top.classList.toggle("compact", chart.scrollTop > 40);
  }, { passive: true });

  render();
  renderChips();
  setSpeed(26);
})();
</script>
