name: Build Android APK

# Builds the Opening Reflex debug APK on GitHub's runners (which ship the
# Android SDK and have open network access), then uploads it as a downloadable
# artifact. Runs automatically on push to the feature branch, and can be
# started by hand from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/chess-openings-trainer-6ggt0t
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace @trainer/app

      - name: Sync Capacitor Android project
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/opening-reflex-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opening-reflex-debug-apk
          path: out/opening-reflex-debug.apk
          if-no-files-found: error

      - name: Publish APK to a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Opening Reflex — latest debug APK
          body: |
            Debug build of the Opening Reflex trainer, built by GitHub Actions.
            Tap `opening-reflex-debug.apk` below to download and install on Android
            (you may need to allow "install from unknown sources").
            Built from commit ${{ github.sha }}.
          files: out/opening-reflex-debug.apk
          prerelease: true
